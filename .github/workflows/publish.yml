name: Publish @soldy_ai/mcp

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version needs publishing
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if npm view @soldy_ai/mcp@$VERSION version 2>/dev/null; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already published. Skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $VERSION"
          fi

  verify:
    needs: check-version
    if: github.event_name == 'pull_request' || needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # No lockfile is committed to the split soldy-mcp repo (this package is
        # a bun workspace member in the monorepo and shares the root bun.lock),
        # so a plain install is used here instead of --frozen-lockfile.
        run: bun install

      - name: Biome check
        run: bunx @biomejs/biome check --no-errors-on-unmatched --files-ignore-unknown=true .

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Test Recast tools
        run: node --test tests/recast.test.mjs

      - name: Pack release candidate
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install agent CLIs for startup checks
        run: npm install --global @openai/codex@0.100.0 @anthropic-ai/claude-code@2.1.121

      - name: Verify customer and admin startup from the tarball
        run: node tests/packed-startup.mjs "$RUNNER_TEMP"/soldy_ai-mcp-*.tgz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: verified-package
          path: ${{ runner.temp }}/soldy_ai-mcp-*.tgz

  publish:
    needs: [check-version, verify]
    if: github.event_name == 'push' && needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: ${{ runner.temp }}

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/soldy_ai-mcp-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.check-version.outputs.tag }}" -m "Release @soldy_ai/mcp ${{ needs.check-version.outputs.version }}"
          git push origin "${{ needs.check-version.outputs.tag }}"
